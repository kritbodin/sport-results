<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รับส่งผลการแข่งขัน · นครลำดวนเกมส์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1;--surface:#fff;--ink:#1b1b19;--ink2:#55554f;--muted:#8a897f;--line:#e1e0d9;--line2:#c3c2b7;
  --accent:#1f5fbf;--accent-weak:#e3ecfa;
  --good:#0ca30c;--good-ink:#006300;--good-weak:#e2f4e2;
  --warn:#fab219;--warn-ink:#7a5300;--warn-weak:#fdf1d4;
  --serious:#ec835a;--crit:#d03b3b;--crit-ink:#a32020;--crit-weak:#fbe5e5;
  --radius:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,"Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px calc(0px);}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.who{font-weight:600;line-height:1.2}
.who small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:13px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.demo{background:var(--warn-weak);border-color:var(--warn);color:var(--warn-ink)}
nav{display:flex;gap:4px;overflow-x:auto;margin:8px -16px 0;padding:0 12px;scrollbar-width:none}
nav button{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--ink2);white-space:nowrap;cursor:pointer;font-weight:600}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
nav .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--crit);color:#fff;font-size:12px;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:16px 16px 96px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:14px 0 6px;color:var(--ink2)}
label.f{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number],input[type=tel],input[type=date],select,textarea{width:100%;padding:12px;border:1px solid var(--line2);border-radius:10px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-weight:600;min-height:46px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good-ink);border-color:var(--good-ink);color:#fff}
.btn.danger{color:var(--crit-ink);border-color:var(--crit)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;text-align:left;line-height:1.25}
.pill small{display:block;color:var(--muted);font-size:12px}
.pill.on{border-color:var(--accent);background:var(--accent-weak);box-shadow:inset 0 0 0 1px var(--accent)}
.pill.done{opacity:.55}
.pill:disabled{cursor:not-allowed}
.muted{color:var(--muted)}
.small{font-size:13px}
.hint{background:var(--accent-weak);border-radius:10px;padding:10px 12px;font-size:14px;color:#123d7a}
.err{background:var(--crit-weak);color:var(--crit-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:96px;height:128px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;border:0;border-radius:999px;width:26px;height:26px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.status{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.st-SUBMITTED{background:var(--warn-weak);color:var(--warn-ink)}
.st-CLAIMED{background:var(--accent-weak);color:var(--accent)}
.st-ENTERED{background:var(--good-weak);color:var(--good-ink)}
.st-RETURNED{background:var(--crit-weak);color:var(--crit-ink)}
.list .item{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.list .item.sel{background:var(--accent-weak)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .m{font-size:13px;color:var(--ink2)}
.bigid{font-size:44px;font-weight:700;letter-spacing:2px;text-align:center;margin:8px 0}
.split{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.split{grid-template-columns:380px 1fr}.sticky{position:sticky;top:120px}}
.photo-box{background:#2a2a28;border-radius:10px;min-height:280px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo-box img{max-width:100%;max-height:70vh;transition:transform .2s;cursor:zoom-in}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1100px){.tiles{grid-template-columns:repeat(7,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .l{font-size:13px;color:var(--ink2)}
.tile .v{font-size:28px;font-weight:700;line-height:1.2}
.tile .v small{font-size:15px;color:var(--muted);font-weight:600}
.tile.alert{border-color:var(--crit);background:var(--crit-weak)}
.tile.alert .v{color:var(--crit-ink)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--ink2);font-weight:600;font-size:13px;white-space:nowrap}
.seg{display:flex;gap:2px;height:8px;min-width:120px;margin-top:4px}
.seg span{display:block;height:100%;border-radius:999px}
.seg .s-done{background:var(--good)}.seg .s-pend{background:var(--warn)}.seg .s-left{background:var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.d-in{background:var(--good)}.d-out{background:var(--line2)}.d-none{background:transparent;border:1.5px solid var(--crit)}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:6px;background:var(--bg);border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.tag.red{background:var(--crit-weak);border-color:var(--crit);color:var(--crit-ink)}
.tag.green{background:var(--good-weak);border-color:var(--good);color:var(--good-ink)}
.people{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.people{grid-template-columns:repeat(3,1fr)}}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar select,.toolbar input{width:auto;padding:8px 10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;overflow:auto}
.overlay img{max-width:none;width:auto;max-height:none}
.overlay .close{position:fixed;top:12px;right:12px}
dialog{border:0;border-radius:14px;padding:20px;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1b19;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:14px}
.center-msg{text-align:center;padding:48px 16px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.tbl-wrap{overflow-x:auto}
a{color:var(--accent)}
.stephead{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.stepno{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.steps span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.steps span.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent);font-weight:600}
.steps span.done{color:var(--good-ink);background:var(--good-weak);border-color:var(--good)}
.warnbox{background:var(--warn-weak);border-color:var(--warn);color:var(--warn-ink)}
.okbox{background:var(--good-weak);color:var(--good-ink);border-radius:10px;padding:10px 12px;font-size:14px}
.daychips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:thin}
.daychip{flex:none;border:1px solid var(--line2);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center;line-height:1.2}
.daychip small{display:block;font-size:12px;color:var(--muted)}
.daychip.on{border-color:var(--accent);background:var(--accent);color:#fff}.daychip.on small{color:#e3ecfa}
.yes{color:var(--good-ink);font-weight:600;white-space:nowrap}.no{color:var(--crit-ink);font-weight:600;white-space:nowrap}.warn{color:var(--warn-ink);font-weight:600}
.bigline{font-size:17px;margin-top:8px}
.actbar{margin:8px -16px 0;padding:8px 16px;background:var(--warn-weak);color:var(--warn-ink);font-size:13px;line-height:1.5}
.actbar .btn{margin-left:6px;vertical-align:middle}
.att td:first-child{width:52%}
.acts{display:flex;gap:14px;align-items:baseline;font-size:13px;margin-top:2px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:13px;white-space:nowrap}
.help h3{color:var(--ink);font-size:16px;margin:16px 0 6px}
.help ol,.help ul{padding-left:22px;margin:6px 0}.help li{margin:4px 0}
.help .q{font-weight:600;margin-top:10px}
.help code{font-family:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="hrow">
    <div class="who" id="who"></div>
    <div class="row" style="gap:6px"><span class="chip demo" id="demoChip" hidden>โหมดทดสอบ</span><span class="chip" id="dateChip"></span></div>
  </div>
  <div id="actBar" class="actbar" hidden></div>
  <nav id="tabs"></nav>
</header>
<main id="app"><div class="center-msg"><div class="spin"></div>กำลังเปิดระบบ…</div></main>
<dialog id="dlg"></dialog>

<script>
/* ===================== ตั้งค่า ===================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbyNRV4gg9f6MKveoF1IyluZlCipxhrytzwp14-sp2FqwjQe2BRRaVnGdIQbpdAx-a-EVg/exec', // URL ของ Apps Script web app
  LIFF_ID: '2012686497-TCDokhkE',                             // LIFF ID จาก LINE Developers
};
/* =================================================== */

const qs = new URLSearchParams(location.search);
const API = qs.get('api') || CONFIG.API_URL;
const DEV = qs.get('dev'); // ?dev=F07 ใช้ได้เฉพาะเมื่อ DEV_MODE=true ฝั่ง server
const RETURN_REASONS = ['รูปไม่ชัด อ่านคะแนนไม่ได้', 'ไม่มีลายเซ็นกรรมการ/ผู้ตัดสิน', 'คู่ที่ไม่ตรงกับฟอร์ม', 'ถ่ายไม่ครบแผ่น', 'ส่งผิดชนิดกีฬา'];
const ST = {SUBMITTED:'⏳ รอรับ', CLAIMED:'✍️ กำลังป้อน', ENTERED:'✅ ป้อน กกท. แล้ว', RETURNED:'↩️ ตีกลับ'};
const DAYS = ['2026-12-04','2026-12-05','2026-12-06','2026-12-07','2026-12-08','2026-12-09','2026-12-10','2026-12-11','2026-12-12','2026-12-13'];

const S = { me:null, today:null, demo:false, tab:null, myDay:null, draft:null, queue:null, sel:null, photoCache:{}, dashDate:null, timers:[], lastWaiting:null,
  act: load('actAs') }; // ผู้ดูแลดูในมุมภาคสนาม/ศูนย์: {role:'field'|'center', group}
// บทบาทที่ใช้แสดงหน้าจอ: ผู้ดูแลที่เปิดโหมดดูในมุมผู้ใช้ → บทบาทนั้น (สิทธิ์ฝั่ง server ยังเป็นผู้ดูแล)
const R = () => (S.me && S.me.role==='admin' && S.act) ? S.act.role : (S.me && S.me.role);

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const thDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-').map(Number); const mo=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m]; return `${dd} ${mo} ${y+543}`; };
const hm = iso => iso ? iso.slice(11,16) : '';
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'k'+Date.now()+Math.random().toString(16).slice(2));
function toast(msg, ms=2600){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function clearTimers(){ S.timers.forEach(clearInterval); S.timers=[]; }
function every(ms, fn){ S.timers.push(setInterval(()=>{ if(!document.hidden) fn(); }, ms)); }
function store(k, v){ try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }

/* ---------- API ---------- */
let idToken = null;
async function api(action, body={}, opts={}){
  const payload = Object.assign({action}, body);
  if (DEV) payload.devUser = DEV; else payload.idToken = idToken;
  if (S.act){ payload.actAs = S.act.role; payload.actGroup = S.act.group || ''; } // server ใช้เฉพาะบัญชีผู้ดูแล
  let lastErr;
  const tries = opts.retries ?? 2;
  for (let i=0;i<=tries;i++){
    try{
      const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload), redirect:'follow'});
      const j = await r.json();
      if (j.me) S.me = j.me;
      if (!j.ok){ const e = new Error(j.message || j.error); e.code = j.error; throw e; }
      return j.data;
    }catch(e){
      lastErr = e;
      if (e.code === 'TOKEN_INVALID' && !DEV && window.liff){ toast('กำลังยืนยันตัวตน LINE ใหม่…'); try{ liff.logout(); }catch(_){} liff.login({redirectUri: location.href}); throw e; }
      if (e.code && e.code !== 'BUSY') throw e;   // server ตอบกลับมาแล้ว ไม่ต้องลองซ้ำ (ยกเว้นคิว lock เต็ม)
      await new Promise(r=>setTimeout(r, 1200*(i+1) + Math.random()*800));
    }
  }
  if (lastErr && lastErr.code === 'BUSY') throw lastErr;
  const e = new Error('เชื่อมต่อไม่ได้ ตรวจสอบสัญญาณอินเทอร์เน็ตแล้วลองอีกครั้ง'); e.code='NETWORK'; e.cause=lastErr; throw e;
}

/* ---------- boot ---------- */
async function boot(){
  try{
    if (!DEV){
      await new Promise((ok,bad)=>{ const s=document.createElement('script'); s.src='https://static.line-scdn.net/liff/edge/2/sdk.js'; s.onload=ok; s.onerror=()=>bad(new Error('โหลด LINE SDK ไม่ได้')); document.head.appendChild(s); });
      await liff.init({liffId: CONFIG.LIFF_ID});
      if (!liff.isLoggedIn()){ liff.login({redirectUri: location.href}); return; }
      idToken = liff.getIDToken();
    }
    const d = await api('me');
    S.today = d.today; S.demo = d.demo; S.dashDate = d.today; S.checkin = d.checkin;
    route();
  }catch(e){
    $('#app').innerHTML = `<div class="card"><h2>เปิดระบบไม่สำเร็จ</h2><div class="err">${esc(e.message)}</div><p class="small muted">ลองปิดแล้วเปิดลิงก์ใหม่จากกลุ่ม LINE ถ้ายังไม่ได้ ใช้แผนสำรอง: ส่งรูปฟอร์มเข้ากลุ่ม LINE พร้อม #ชนิดกีฬา คู่ที่ รหัสเวร</p></div>`;
  }
}

function route(){
  const me = S.me;
  if (!me.bound){ $('#hdr').hidden = true; return me.pending ? viewPending() : viewBind(); }
  if (S.act && me.role!=='admin'){ S.act = null; store('actAs'); } // เครื่องที่เคยใช้บัญชีผู้ดูแล
  $('#hdr').hidden = false;
  const actBar = $('#actBar');
  actBar.hidden = !S.act;
  if (S.act) actBar.innerHTML = `👁 ผู้ดูแลกำลังดูในมุม <b>${S.act.role==='center'?'ศูนย์ป้อนข้อมูล':'ภาคสนาม กลุ่ม '+esc(S.act.group)}</b> · ทุกอย่างบันทึกในชื่อผู้ดูแล${S.demo?'':' · <b>วันนี้ไม่ใช่วันทดสอบ ผลที่ส่งนับเป็นผลจริง</b>'}
    <div class="row" style="margin-top:6px"><button class="btn sm" id="actSwap">${S.act.role==='center'?'สลับไปภาคสนาม กลุ่ม '+esc(S.act.last||'ก'):'สลับไปศูนย์'}</button><button class="btn sm" id="actExit">กลับเป็นผู้ดูแล</button></div>`;
  if (S.act){
    $('#actExit').onclick = () => setAct(null);
    $('#actSwap').onclick = () => setAct(S.act.role==='center' ? {role:'field', group:S.act.last||'ก'} : {role:'center', group:'', last:S.act.group});
  }
  $('#who').innerHTML = `${esc(me.code==='ADMIN' ? 'ผู้ดูแลระบบ' : me.code==='VIEWER' ? me.name : me.code+' · '+me.name)}<small>${{field:'ภาคสนาม'+(me.group?' กลุ่ม '+me.group:''),center:'ศูนย์ป้อนข้อมูล',admin:'ผู้ดูแล',viewer:'เจ้าหน้าที่ · ดูอย่างเดียว'}[me.role]||''}${me.sub?` · <b style="color:var(--warn-ink)">วันนี้มาแทน ${esc(me.sub.replacesName)}</b>`:''}${me.lineName?' · LINE: '+esc(me.lineName):''}</small>`;
  $('#dateChip').textContent = thDate(S.today);
  $('#demoChip').hidden = !S.demo;
  // ภาคสนาม/ศูนย์เห็นเฉพาะหน้าของตัวเอง เรียงตามลำดับงานพร้อมเลขขั้น · ขั้นที่ทำแล้วขึ้น ✓
  // โหมดดูในมุมผู้ใช้: ผู้ดูแลเช็กอินได้จุดเดียว → ✓ เฉพาะเมื่อจุดตรงกับฝั่งที่กำลังดู
  const atCenter = S.checkin && S.checkin.sport === 'ศูนย์ป้อนข้อมูล';
  const ok1 = S.checkin && (!S.act || (S.act.role==='center') === atCenter) ? ' ✓' : '';
  const tabs = {
    field:  [['checkin','① เช็กอิน'+ok1],['submit','② ส่งผล'],['mine','③ ติดตามผล'],['help','❓ วิธีใช้']],
    center: [['checkin','① เข้าศูนย์'+ok1],['queue','② คิวรับผล'],['help','❓ วิธีใช้']],

async function shrink(file, max=1600, q=0.82){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=bad; i.src=url; });
    const k = Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}

}

/* ---------- queue (center) ---------- */
let qFilter = 'SUBMITTED';
async function viewQueue(){
  $('#app').innerHTML = `<div class="toolbar">
      <div class="pills" id="qf"></div><span class="grow"></span>
      <select id="qDate">${DAYS.concat(DAYS.includes(S.today)?[]:[S.today]).map(d=>`<option value="${d}" ${d===(S.qDate||S.today)?'selected':''}>${thDate(d)}</option>`).join('')}</select>
      <button class="btn sm" id="qR">รีเฟรช</button></div>
    <div class="steps small"><span><b>①</b> เลือกรายการ "รอรับ" แล้วกด <b>รับรายการนี้</b></span><span><b>②</b> ดูรูป แล้วป้อนผลในระบบ กกท.</span><span><b>③</b> กด <b>ป้อน กกท. แล้ว</b></span></div>
    <div class="split"><div class="card" style="padding:0"><div class="list" id="qList"><div class="center-msg"><div class="spin"></div>กำลังโหลดคิว…</div></div></div><div id="qDet" class="sticky"></div></div>`;
  $('#qDate').onchange = e => { S.qDate = e.target.value; S.sel=null; S.queue=null; refreshQueue(); };
  $('#qR').onclick = refreshQueue;
  if (S.queue && S.queue.date === (S.qDate||S.today)) renderQueue();
  await refreshQueue();
  every(20000, refreshQueue);
}
async function refreshQueue(){
  try{ S.queue = await api('queue', {date:S.qDate||S.today}); }catch(e){ if (!S.queue) $('#qList').innerHTML = `<div class="err">${esc(e.message)}</div>`; else toast(e.message); return; }
  if (S.tab==='queue' && $('#qList')) renderQueue();
}
function renderQueue(){
  const q = S.queue;
  const items = q.items, me = S.me.code;
  const waiting = items.filter(s=>s.status==='SUBMITTED').length;
  if (S.lastWaiting !== null && waiting > S.lastWaiting) beep();
  S.lastWaiting = waiting;
  document.title = (waiting?`(${waiting}) `:'') + 'คิวรับผล';
  const qb = $('#qBadge'); if (qb){ qb.hidden=!waiting; qb.textContent=waiting; }
  const F = [['SUBMITTED','รอรับ'],['MINE','ของฉัน'],['RETURNED','ตีกลับ'],['ENTERED','ป้อนแล้ว'],['ALL','ทั้งหมด']];
  const cnt = k => k==='ALL'?items.length : k==='MINE'? items.filter(s=>s.status==='CLAIMED'&&s.claimCode===me).length : items.filter(s=>s.status===k).length;
  $('#qf').innerHTML = F.map(([k,l])=>`<button class="pill ${qFilter===k?'on':''}" data-f="${k}">${l} <b>${cnt(k)}</b></button>`).join('');
  $('#qf').onclick = e => { const b=e.target.closest('[data-f]'); if(b){ qFilter=b.dataset.f; renderQueue(); } };
  const shown = items.filter(s => qFilter==='ALL' || (qFilter==='MINE' ? (s.status==='CLAIMED'&&s.claimCode===me) : s.status===qFilter));
  $('#qList').innerHTML = shown.length ? shown.map(s=>`<div class="item ${S.sel===s.id?'sel':''}" data-id="${esc(s.id)}"><div class="grow">
      <div class="t">${esc(s.id)} · ${esc(s.sport)} คู่ที่ ${esc(s.matchNo)} ${s.duplicateOf?'<span class="tag red">ซ้ำกับ '+esc(s.duplicateOf)+'</span>':''}${s.resubmitCount?'<span class="tag">ส่งใหม่</span>':''}${s.isTest?'<span class="tag">ทดสอบ</span>':''}</div>
      <div class="m">${esc(s.fieldName)} · ${hm(s.submittedAt)} น.${s.claimName?' · '+esc(s.claimName):''}</div></div>
      <span class="status st-${s.status}">${ST[s.status]}</span></div>`).join('') : `<div class="center-msg">ไม่มีรายการ</div>`;
  $('#qList').onclick = e => { const it=e.target.closest('[data-id]'); if(it){ S.sel=it.dataset.id; refreshQueueSel();
    if (window.innerWidth < 900) $('#qDet').scrollIntoView({block:'start', behavior:'smooth'}); } };
  refreshQueueSel();
  prefetchPhotos(items.filter(s=>s.status==='SUBMITTED' || (s.status==='CLAIMED' && s.claimCode===me)).slice(0,3));
}
// โหลดรูปแรกของรายการต้นคิวไว้ล่วงหน้า (ทีละรูป) กดเลือกแล้วรูปขึ้นทันที
let prefetching = false;
async function prefetchPhotos(list){
  if (prefetching) return; prefetching = true;
  try{
    for (const s of list){
      const key = s.id+'#0#'+s.resubmitCount;
      if (!s.photoCount || S.photoCache[key]) continue;
      try{ const p = await api('photo', {id:s.id, index:0}, {retries:0}); S.photoCache[key] = `data:${p.mime};base64,${p.base64}`; }catch(e){ break; }
    }
  } finally { prefetching = false; }
}
function refreshQueueSel(){
  document.querySelectorAll('#qList .item').forEach(el=>el.classList.toggle('sel', el.dataset.id===S.sel));
  const s = S.queue && S.queue.items.find(x=>x.id===S.sel);
  const box = $('#qDet');
  if (!s){ box.innerHTML = `<div class="card center-msg">เลือกรายการทางซ้ายเพื่อดูรูปฟอร์ม</div>`; return; }
  const me = S.me.code, admin = S.me.role==='admin' && !S.act; // โหมดดูในมุมศูนย์: ซ่อนปุ่มเฉพาะผู้ดูแล
  const mineClaim = s.status==='CLAIMED' && (s.claimCode===me || admin);
  const sig = [s.id,s.status,s.claimCode,s.photoCount,s.resubmitCount,s.verifiedBy].join('|');
  if (box.dataset.sig === sig) return;  // ไม่ต้องวาดใหม่ถ้าไม่มีอะไรเปลี่ยน (รูปไม่กระพริบ)
  box.dataset.sig = sig;
  box.innerHTML = `<div class="card">
    <div class="hrow"><h2 style="margin:0">${esc(s.id)} · ${esc(s.sport)} คู่ที่ ${esc(s.matchNo)}</h2><span class="status st-${s.status}">${ST[s.status]}</span></div>
    ${(()=>{ const cur = s.status==='SUBMITTED'?0 : s.status==='CLAIMED'?(mineClaim?1:-1) : s.status==='ENTERED'?3 : -1;
      if (cur<0) return s.status==='CLAIMED'?`<div class="small muted" style="margin-top:6px">${esc(s.claimName)} รับรายการนี้ไปแล้ว</div>`:'';
      return `<div class="steps small" style="margin:8px 0 0">${['รับรายการ','ดูรูป ป้อน กกท.','กด "ป้อน กกท. แล้ว"'].map((t,i)=>`<span class="${i<cur?'done':i===cur?'on':''}">${i<cur?'✓':'①②③'[i]} ${t}</span>`).join('')}</div>`; })()}
    <dl class="kv"><dt>ผู้ส่ง</dt><dd>${esc(s.fieldName)} · ${hm(s.submittedAt)} น.</dd><dt>สนาม</dt><dd>${esc(s.venue||'-')}</dd>
      ${s.claimName?`<dt>ผู้รับ</dt><dd>${esc(s.claimName)} · ${hm(s.claimedAt)} น.</dd>`:''}
      ${s.enteredName?`<dt>ป้อน กกท.</dt><dd>${esc(s.enteredName)} · ${hm(s.enteredAt)} น.</dd>`:''}
      ${s.verifiedBy?`<dt>ตรวจทาน</dt><dd>${esc(s.verifiedBy)} · ${hm(s.verifiedAt)} น.</dd>`:''}
      ${s.returnReason?`<dt>ตีกลับ</dt><dd>${esc(s.returnReason)} (${esc(s.returnedBy)})</dd>`:''}
      ${s.duplicateOf?`<dt>คำเตือน</dt><dd class="tag red">คู่นี้ส่งซ้ำกับ ${esc(s.duplicateOf)} — ตรวจว่าคู่ที่ถูกต้อง</dd>`:''}</dl>
    <div class="row" style="margin:4px 0 12px">
      ${s.status==='SUBMITTED'?`<button class="btn pri" data-a="claim">รับรายการนี้</button>`:''}
      ${mineClaim?`<button class="btn good" data-a="entered">ป้อน กกท. แล้ว</button><button class="btn" data-a="release">คืนคิว</button>`:''}
      ${(s.status==='SUBMITTED'||mineClaim)?`<button class="btn danger" data-a="return">ตีกลับ</button>`:''}
      ${s.status==='ENTERED'&&S.queue.verifyEnabled&&!s.verifiedBy&&(s.enteredBy!==me||admin)?`<button class="btn" data-a="verify">ตรวจทานแล้ว</button>`:''}
      ${s.status==='ENTERED'&&admin?`<button class="btn danger" data-a="return">ตีกลับ (ผู้ดูแล)</button>`:''}
    </div>
    <div class="row" id="pTabs">${Array.from({length:s.photoCount},(_,i)=>`<button class="btn sm" data-p="${i}">รูป ${i+1}</button>`).join('')}<button class="btn sm" id="rot">⟳ หมุน</button></div>
    <div class="photo-box" id="pBox" style="margin-top:8px"><div class="spin"></div></div>
    <div class="small muted" style="margin-top:6px">แตะรูปเพื่อขยาย</div></div>`;
  let rot = 0, cur = 0;
  const show = async i => {
    cur = i; const key = s.id+'#'+i+'#'+s.resubmitCount;
    $('#pBox').innerHTML = '<div class="spin"></div>';
    try{
      if (!S.photoCache[key]){ const p = await api('photo', {id:s.id, index:i}); S.photoCache[key] = `data:${p.mime};base64,${p.base64}`; }
      if (S.sel!==s.id) return;
      $('#pBox').innerHTML = `<img src="${S.photoCache[key]}" style="transform:rotate(${rot}deg)">`;
      $('#pBox img').onclick = () => zoom(S.photoCache[key], rot);
    }catch(e){ $('#pBox').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
  };
  if (s.photoCount) show(0); else $('#pBox').innerHTML='<span class="muted">ไม่มีรูป</span>';
  $('#pTabs').onclick = e => { const b=e.target.closest('[data-p]'); if(b) show(+b.dataset.p); };
  $('#rot').onclick = () => { rot=(rot+90)%360; const im=$('#pBox img'); if(im) im.style.transform=`rotate(${rot}deg)`; };
  box.querySelectorAll('[data-a]').forEach(b => b.onclick = async () => {
    const a = b.dataset.a; let body = {id:s.id};
    if (a==='return'){
      const r = await reasonDlg(); if (!r) return; body.reason = r;
    }
    if (a==='entered' && !await confirmDlg('ยืนยันป้อนผลแล้ว', `ป้อน <b>${esc(s.sport)} คู่ที่ ${esc(s.matchNo)}</b> ในระบบ กกท. เรียบร้อยแล้ว?`, 'ยืนยัน')) return;
    box.querySelectorAll('[data-a]').forEach(x => x.disabled = true);
    b.textContent = 'กำลังบันทึก…';
    try{
      const upd = await api({claim:'claim',release:'release',entered:'entered',return:'returnSub',verify:'verify'}[a], body);
      // อัปเดตรายการในเครื่องทันทีจากผลที่ server ตอบ แล้วค่อยดึงคิวทั้งหมดเบื้องหลัง
      const i = S.queue.items.findIndex(x=>x.id===upd.id); if (i>=0) S.queue.items[i] = upd;
      toast({claim:'รับแล้ว ✓ ดูรูปแล้วป้อน กกท.', entered:'บันทึกแล้ว ✓ เลือกรายการถัดไป', release:'คืนคิวแล้ว', return:'ตีกลับแล้ว', verify:'ตรวจทานแล้ว'}[a]);
      if (a==='claim') qFilter='MINE';
      if (a==='entered' || a==='return' || a==='release'){ qFilter='SUBMITTED'; }
    }
    catch(e){ toast(e.message, 4000); }
    box.dataset.sig=''; renderQueue(); refreshQueue();
    box.scrollIntoView({block:'start',behavior:'smooth'});
  });
}
function zoom(src, rot){
  const o = document.createElement('div'); o.className='overlay';
  o.innerHTML = `<button class="btn close">ปิด ✕</button><img src="${src}" style="transform:rotate(${rot}deg)">`;
  o.onclick = e => { if (e.target.tagName!=='IMG') o.remove(); };
  document.body.appendChild(o);
}
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); const o=c.createOscillator(); const g=c.createGain(); o.frequency.value=880; g.gain.value=.08; o.connect(g); g.connect(c.destination); o.start(); setTimeout(()=>{o.stop();c.close();},180);}catch(e){} }

async function viewDash(){
  $('#app').innerHTML = `<div class="toolbar"><select id="dDate">${DAYS.concat(DAYS.includes(S.today)?[]:[S.today]).map(d=>`<option value="${d}" ${d===S.dashDate?'selected':''}>${thDate(d)}</option>`).join('')}</select>
    <button class="btn sm" id="dR">รีเฟรช</button><span class="small muted" id="dAt"></span></div><div id="dBody"><div class="center-msg"><div class="spin"></div></div></div>`;
  $('#dDate').onchange = e => { S.dashDate = e.target.value; refreshDash(); };
  $('#dR').onclick = refreshDash;
  await refreshDash();
  every(60000, refreshDash);
}
async function refreshDash(){
  let d; try{ d = await api('dashboard', {date:S.dashDate}); }catch(e){ $('#dBody').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  $('#dAt').textContent = 'อัปเดต ' + hm(d.generatedAt) + ' น. · รีเฟรชเองทุก 1 นาที';
  const sm = d.summary, P = Object.fromEntries(d.people.map(p=>[p.code,p]));
  const remaining = sm.sportsTotal - sm.sportsComplete;
  const tile = (l,v,cls='',sub='') => `<div class="tile ${cls}"><div class="l">${l}</div><div class="v">${v}${sub?` <small>${sub}</small>`:''}</div></div>`;
  const sports = d.sports.slice().sort((a,b)=> (a.complete-b.complete) || (b.overdue.length-a.overdue.length) || a.group.localeCompare(b.group,'th') || a.sport.localeCompare(b.sport,'th'));
  const seg = s => { const T = Math.max(s.total||0, s.submitted); if (!T) return `<div class="seg" title="ยังไม่มีข้อมูลจำนวนคู่"><span class="s-left" style="flex:1"></span></div>`;
    const parts = [['s-done',s.entered],['s-pend',s.pendingEntry],['s-left',Math.max(0,T-s.submitted)]].filter(p=>p[1]>0);
    return `<div class="seg" title="ป้อนแล้ว ${s.entered} · รอป้อน ${s.pendingEntry} · ยังไม่ส่ง ${Math.max(0,T-s.submitted)}">${parts.map(([c,v])=>`<span class="${c}" style="flex:${v}"></span>`).join('')}</div>`; };
  const nm = c => P[c] ? esc(c+' '+P[c].name.replace(/^(นาย|นางสาว|น\.ส\.?|นาง)\s*/,'')) : esc(c);
  const per = (role) => d.people.filter(p=>p.role===role).sort((a,b)=>(a.group||'').localeCompare(b.group||'','th')||a.code.localeCompare(b.code));
  const personRow = p => { const t = d.perPerson[p.code]||{};

const DOW = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const shortDate = d => { const [y,m,dd] = d.split('-').map(Number); return `${DOW[new Date(Date.UTC(y,m-1,dd)).getUTCDay()]} ${dd} ${['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m]}`; };
let aOnlyMissing = false;
async function viewAttend(){
  if (!S.attDate) S.attDate = S.today;
  $('#app').innerHTML = `<div class="card" style="padding:12px 12px 4px"><div class="small muted">เลือกวันที่ (ตัวเลข = มาแล้ว / มีเวร)</div><div class="daychips" id="aDays"></div></div>
    <div id="aBody"><div class="center-msg"><div class="spin"></div>กำลังโหลดเวร…</div></div>`;
  if (S.att && S.att.date === S.attDate) renderAttend(S.att);
  await refreshAttend();
  every(60000, refreshAttend);
}
async function refreshAttend(){
  try{ S.att = await api('attendance', {date:S.attDate}); }
  catch(e){ if ($('#aBody')) $('#aBody').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  if (S.tab==='attend' && $('#aBody')) renderAttend(S.att);
}
function renderAttend(d){
  const days = d.days.some(x=>x.date===d.date) ? d.days : [...d.days, {date:d.date, rostered:0, came:0}].sort((a,b)=>a.date<b.date?-1:1);
  $('#aDays').innerHTML = days.map(x=>`<button class="daychip ${x.date===d.date?'on':''}" data-d="${x.date}"><b>${shortDate(x.date)}</b><small>${x.came}/${x.rostered}${x.date===S.today?' · วันนี้':''}${x.isTest?' · ทดสอบ':''}</small></button>`).join('');
  $('#aDays').onclick = e => { const b=e.target.closest('[data-d]'); if(!b || b.dataset.d===S.attDate) return; S.attDate=b.dataset.d; S.att=null;
    $('#aBody').innerHTML = '<div class="center-msg"><div class="spin"></div>กำลังโหลดเวร…</div>'; renderAttendDays(b.dataset.d); refreshAttend(); };
  const on = $('#aDays .on'); if (on) on.scrollIntoView({inline:'center', block:'nearest'});

  const sm = d.summary;
  const nm = p => esc(p.code+' '+String(p.name||'').replace(/^(นาย|นางสาว|น\.ส\.?|นาง)\s*/,''));
  const sections = [];
  const ros = d.people.filter(p=>p.rostered);
  const center = ros.filter(p=>p.role==='center');
  if (center.length) sections.push({title:'ศูนย์ป้อนข้อมูล', posts:['ศูนย์ป้อนข้อมูล'], people:center});
  [...new Set(ros.filter(p=>p.role!=='center').map(p=>p.group||''))].sort((a,b)=>a.localeCompare(b,'th')).forEach(g => {
    const ps = ros.filter(p=>p.role!=='center' && (p.group||'')===g);
    sections.push({title:'ภาคสนาม'+(g?' กลุ่ม '+g:''), posts:ps[0].posts, people:ps});
  });
  const extra = d.people.filter(p=>!p.rostered);
  if (extra.length) sections.push({title:'มาช่วย (ไม่มีเวรวันนี้)', posts:[], people:extra});

  const came = p => p.firstIn ? `<span class="yes">✓ ${hm(p.firstIn)}</span>` : `<span class="no">✗ ยังไม่มา</span>`;
  const post = p => p.status==='post' ? `<span class="yes">✓ ${esc(p.now)}</span>`
    : p.status==='away' ? `<span class="warn">⚠️ อยู่ที่ ${esc(p.now||'-')}</span>`
    : p.status==='left' ? `<span class="muted">ออกแล้ว ${hm(p.lastOut)}</span>` : `<span class="muted">—</span>`;
  const row = p => `<tr><td><b>${nm(p)}</b>${p.replaces?`<div><span class="tag" style="background:var(--warn-weak);border-color:var(--warn)">แทน ${esc(p.replaces+' '+String(p.replacesName||'').replace(/^(นาย|นางสาว|น\.ส\.?|นาง)\s*/,''))}</span></div>`:''}
      ${p.trail.length>1?`<div class="small muted">${p.trail.map(t=>hm(t.inAt)+' '+esc(t.sport||'-')).join(' → ')}</div>`:''}
      <div class="acts">${p.phone?`<a href="tel:${esc(p.phone)}">โทร</a>`:''}
      ${p.rostered ? (p.replaces ? `<button class="linkbtn" data-unsub="${esc(p.code)}" data-o="${esc(p.replaces)}">ยกเลิกแทน</button>` : `<button class="linkbtn" data-sub="${esc(p.code)}">ระบุคนแทน</button>`) : ''}</div></td>
    <td><div>${came(p)}</div><div style="margin-top:2px">${post(p)}</div></td></tr>`;
  const pct = sm.rostered ? Math.round(sm.came/sm.rostered*100) : 0;
  $('#aBody').innerHTML = `
    <div class="card">
      <div class="hrow"><h2 style="margin:0">เวรวันที่ ${thDate(d.date)}</h2><span class="small muted">อัปเดต ${hm(d.generatedAt)} น.</span></div>
      ${sm.rostered ? `<div class="bigline">มาแล้ว <b>${sm.came}</b> / ${sm.rostered} คน · ประจำตำแหน่ง <b>${sm.post}</b> · ยังไม่มา <b class="${sm.absent&&d.isToday?'no':''}">${sm.absent}</b>${sm.away?` · อยู่ผิดจุด <b class="warn">${sm.away}</b>`:''}</div>
        <div class="seg" style="height:10px;margin-top:8px"><span class="s-done" style="flex:${sm.post}"></span><span class="s-pend" style="flex:${sm.away+sm.left}"></span><span class="s-left" style="flex:${sm.absent}"></span></div>
        <div class="small muted" style="margin-top:4px">มาแล้ว ${pct}% · <span class="dot" style="background:var(--good)"></span>ประจำตำแหน่ง <span class="dot" style="background:var(--warn)"></span>อยู่จุดอื่น/ออกแล้ว <span class="dot" style="background:var(--line)"></span>ยังไม่มา</div>
        <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="aMiss" ${aOnlyMissing?'checked':''}> แสดงเฉพาะคนที่ยังไม่ได้ประจำตำแหน่ง</label>`
      : '<p class="muted">ไม่มีเวรในวันนี้</p>'}
    </div>
    ${sections.map(sec => { const ps = sec.people.filter(p=>!aOnlyMissing || p.status!=='post');
      const c1 = sec.people.filter(p=>p.firstIn).length, c2 = sec.people.filter(p=>p.status==='post').length;
      return `<div class="card"><div class="hrow"><h2 style="margin:0">${esc(sec.title)}</h2><span class="small">มา <b>${c1}</b>/${sec.people.length} · ประจำ <b>${c2}</b></span></div>
        ${sec.posts.length?`<div class="small muted" style="margin:4px 0 6px">ตำแหน่ง: ${sec.posts.map(esc).join(', ')}</div>`:''}
        ${ps.length ? `<div class="tbl-wrap"><table class="att"><thead><tr><th>ชื่อ</th><th>มาแล้ว / ประจำตำแหน่ง</th></tr></thead><tbody>${ps.map(row).join('')}</tbody></table></div>`
          : '<p class="small muted">ทุกคนประจำตำแหน่งแล้ว ✓</p>'}</div>`; }).join('')}`;
  if ($('#aMiss')) $('#aMiss').onchange = e => { aOnlyMissing = e.target.checked; renderAttend(d); };
  $('#aBody').onclick = async e => {
    const sb = e.target.closest('[data-sub]'), us = e.target.closest('[data-unsub]');
    if (sb){ const p = d.people.find(x=>x.code===sb.dataset.sub); const sub = await subDlg(p, d); if (!sub) return;
      try{ await api('adminSubstitute', {date:d.date, code:p.code, sub}); toast(`บันทึกแล้ว: ${sub} แทน ${p.replaces||p.code}`); }catch(err){ toast(err.message, 4000); }
      refreshAttend(); }
    if (us && await confirmDlg('ยกเลิกการแทน?', `คืนเวรวันที่ ${thDate(d.date)} ให้ <b>${esc(us.dataset.o)}</b> · ${esc(us.dataset.unsub)} จะกลับเป็นบทบาทเดิม`, 'ยกเลิกการแทน')){
      try{ await api('adminSubstitute', {date:d.date, code:us.dataset.unsub, cancel:true}); toast('คืนเวรแล้ว'); }catch(err){ toast(err.message, 4000); }
      refreshAttend(); }
  };
}
// เลือกคนแทน: แสดงเฉพาะคนที่ไม่มีเวรวันนั้น แยกตามบทบาทเดิม · คนแทนได้สิทธิ์ตามตำแหน่งนี้เฉพาะวันนั้น
function subDlg(p, d){
  const busy = new Set(d.people.filter(x=>x.rostered).map(x=>x.code));
  const free = d.staff.filter(s=>!busy.has(s.code));
  const pos = p.role==='center' ? 'ศูนย์ป้อนข้อมูล' : 'ภาคสนาม' + (p.group?' กลุ่ม '+p.group:'');
  const opt = s => `<option value="${esc(s.code)}">${esc(s.code+' '+s.name)}${s.role==='field'&&s.group?' (กลุ่ม '+esc(s.group)+')':''}</option>`;
  const grp = (role, label) => { const xs = free.filter(s=>s.role===role); return xs.length?`<optgroup label="${label}">${xs.map(opt).join('')}</optgroup>`:''; };
  return new Promise(res => { const dl = dlg(`<h2>ระบุคนแทน</h2>
    <dl class="kv"><dt>เวรของ</dt><dd>${esc(p.replaces ? p.replaces+' (ตอนนี้ '+p.code+' แทนอยู่)' : p.code+' '+p.name)}</dd><dt>วันที่</dt><dd>${thDate(d.date)}</dd><dt>ตำแหน่ง</dt><dd>${esc(pos)}</dd></dl>
    <label class="f">คนที่มาแทน (เฉพาะคนที่ไม่มีเวรวันนี้)</label>
    <select id="sv"><option value="">— เลือก —</option>${grp('field','ภาคสนาม')}${grp('center','ศูนย์ป้อนข้อมูล')}</select>
    <p class="small muted">คนแทนจะได้หน้าจอและสิทธิ์ของ "${esc(pos)}" เฉพาะวันนี้ วันอื่นใช้บทบาทเดิม ต้องลงทะเบียนในแอปแล้วจึงจะเข้าใช้ได้</p>
    <div class="row"><button class="btn" id="dn">ยกเลิก</button><button class="btn pri" id="dy">บันทึก</button></div>`);
    $('#dy').onclick = () => { const v = $('#sv').value; if (!v) return; dl.close(); res(v); };
    $('#dn').onclick = () => { dl.close(); res(null); }; dl.oncancel = () => res(null); });
}

function viewHelp(unbound){
  const role = unbound ? 'field' : R() || 'field';
  const keys = ['field','center','viewer'].concat(role==='admin'?['admin']:[]).concat(['backup']);
  let cur = S.helpTab && keys.includes(S.helpTab) ? S.helpTab : (keys.includes(role) ? role : 'field');
  const render = () => {
    $('#app').innerHTML = `<div class="card help" style="max-width:760px;margin:0 auto">
      ${unbound?'<button class="btn sm" id="hBack" style="margin-bottom:10px">← กลับไปลงทะเบียน</button>':''}
      <h2>วิธีใช้ / คู่มือ</h2>
      <div class="pills" id="hT">${keys.map(k=>`<button class="pill ${k===cur?'on':''}" data-k="${k}">${HELP[k][0]}${k===role&&!unbound?' (คุณ)':''}</button>`).join('')}</div>
      <div id="hBody">${HELP[cur][1]}</div></div>`;
    $('#hT').onclick = e => { const b=e.target.closest('[data-k]'); if(b){ cur = S.helpTab = b.dataset.k; render(); } };
    if ($('#hBack')) $('#hBack').onclick = viewBind;
  };
  render();
}

function dlg(html){ const d=$('#dlg'); d.innerHTML=html; d.showModal(); return d; }
function confirmDlg(title, body, okTxt='ตกลง', cancelTxt='ยกเลิก'){
  return new Promise(res => { const d = dlg(`<h2>${title}</h2><p>${body}</p><div class="row"><button class="btn" id="dn">${cancelTxt}</button><button class="btn pri" id="dy">${okTxt}</button></div>`);
    $('#dy').onclick=()=>{d.close();res(true)}; $('#dn').onclick=()=>{d.close();res(false)}; d.oncancel=()=>res(false); });
}
function promptDlg(title, label, type='text'){
  return new Promise(res => { const d = dlg(`<h2>${title}</h2><label class="f">${label}</label><input id="pv" type="${type}" inputmode="${type==='number'?'numeric':'text'}"><div class="row" style="margin-top:12px"><button class="btn" id="dn">ยกเลิก</button><button class="btn pri" id="dy">ตกลง</button></div>`);
    $('#pv').focus(); $('#dy').onclick=()=>{ const v=$('#pv').value.trim(); if(!v) return; d.close(); res(v); }; $('#dn').onclick=()=>{d.close();res(null)}; d.oncancel=()=>res(null); });
}
function reasonDlg(){
  return new Promise(res => { const d = dlg(`<h2>ตีกลับให้ภาคสนาม</h2><div class="pills" id="rr">${RETURN_REASONS.map(r=>`<button class="pill" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
    <label class="f">หรือระบุเอง</label><input id="rv" type="text"><div class="row" style="margin-top:12px"><button class="btn" id="dn">ยกเลิก</button><button class="btn danger" id="dy">ตีกลับ</button></div>`);
    $('#rr').onclick=e=>{ const b=e.target.closest('[data-r]'); if(b) $('#rv').value=b.dataset.r; };
    $('#dy').onclick=()=>{ const v=$('#rv').value.trim(); if(!v) return; d.close(); res(v); }; $('#dn').onclick=()=>{d.close();res(null)}; d.oncancel=()=>res(null); });
}

document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && S.me.bound && ['queue','dash','mine','attend'].includes(S.tab)) route(); });
boot();
</script>
